
name: Deploy EmpleadoDelMes API to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build and Publish API
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore EmpleadoDelMes.slnx

      - name: Build solution
        run: |
          dotnet build EmpleadoDelMes.slnx \
            --configuration Release \
            --no-restore

      - name: Publish API
        run: |
          dotnet publish src/EmpleadoDelMes.Api/EmpleadoDelMes.Api.csproj \
            --configuration Release \
            --no-restore \
            --output ./publish

      - name: Verify published files
        run: |
          test -f ./publish/EmpleadoDelMes.Api.dll
          ls -lah ./publish

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: empleadodelmes-api
          path: ./publish
          if-no-files-found: error

  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: empleadodelmes-api
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_5EA6314986014C9EBA12A4B6849B0B49 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B1393D6F218A4D4291980D9EBACFF12B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1398BF749142479AB7096F47981D071D }}

      - name: Deploy API
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-mesa-empleadodelmes-api-prod
          slot-name: Production
          package: ./publish
